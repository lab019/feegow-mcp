name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Arquivos não formatados (rode 'gofmt -w .'):"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./... -count=1

      # O teste de contrato (build tag `contract`) fica fora do `go test ./...`
      # de propósito — ele bate na API real. Mas ficar fora do CI significa
      # que ele apodrece calado: uma mudança no Registry ou no Client quebra a
      # compilação dele e ninguém descobre até a próxima vez que alguém rodar
      # a suíte à mão, com um token na mão. `go vet -tags=contract` compila e
      # analisa o arquivo sem executar nada.
      - name: go vet (teste de contrato)
        run: go vet -tags=contract ./...

      # TestContract_WriteProbeClassified é o guarda que impede um endpoint de
      # ESCRITA novo de cair na sondagem por padrão: ele exige que todo
      # POST/PUT do Registry esteja explicitamente em writeProbeAllowIDs ou em
      # writeProbeDenyIDs. Só lê o Registry — sem token, sem rede — então roda
      # aqui, onde a classificação faltando vira PR vermelho em vez de uma
      # sondagem silenciosa contra uma licença real meses depois.
      - name: go test (classificação de escrita do teste de contrato)
        run: go test -tags=contract ./internal/feegow/... -run TestContract_WriteProbeClassified -count=1
