name: build-push

# Builda a imagem de produção e publica no GHCR
# (ghcr.io/lab019/feegow-mcp). A stack de prod (lab019/agent-operation) puxa
# essas tags. A auth usa o GITHUB_TOKEN do próprio workflow — sem secret extra.

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  # workflow_dispatch para buildar/publicar a partir de uma branch sob demanda.
  workflow_dispatch:

concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Carimba no binário a MESMA string da tag de imagem sha-<commit>
          # que este build publica, para o que o serviço reporta em runtime
          # (log de startup, --version, handshake MCP) apontar para uma tag
          # que se pode dar pull. A SEMVER não serve aqui: ela só é calculada
          # pelo workflow de release DEPOIS deste build, que então retagueia
          # esta imagem sem rebuildar. Ver o ARG VERSION no Dockerfile.
          build-args: |
            VERSION=sha-${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
